name: Publish to JSR

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: jsr-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          deno eval '
            import { VERSION } from "./src/version.ts";
            const config = JSON.parse(await Deno.readTextFile("deno.json"));
            const tag = Deno.env.get("RELEASE_TAG");
            if (tag !== `v${config.version}` || VERSION !== config.version) {
              throw new Error(`Tag ${tag}, package ${config.version}, and CLI ${VERSION} must match`);
            }
          '
      - run: deno install --frozen
      - name: Publish with GitHub OIDC and provenance
        run: deno publish --frozen
